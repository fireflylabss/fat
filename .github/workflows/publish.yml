name: Publish release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v0.2.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify crate version matches release
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: test "v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')" = "$TAG"

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

      - name: Build AUR metadata
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          chmod +x packaging/aur/bump.sh
          ./packaging/aur/bump.sh "$TAG"

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v3.0.1
        with:
          pkgname: ofat
          pkgbuild: ./packaging/aur/PKGBUILD
          commit_username: horizzon3507
          commit_email: horizzon3507@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ github.event.release.tag_name || inputs.tag }}

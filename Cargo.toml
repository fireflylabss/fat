[package]
name = "fat"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "fat — a fast, syntax-aware cat alternative"
authors = ["AEFireflyLabs"]
license = "Apache-2.0"
readme = "README.md"
keywords = ["cat", "terminal", "cli", "syntax-highlighting", "rust"]
categories = ["command-line-utilities"]

[[bin]]
name = "fat"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
